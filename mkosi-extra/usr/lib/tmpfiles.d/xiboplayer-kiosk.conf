# Create xibo home directory structure and populate from skel
# (sysusers.d creates the user but doesn't copy skel)
d /home/xibo 0755 xibo xibo -
d /home/xibo/.local 0755 xibo xibo -
d /home/xibo/.local/bin 0755 xibo xibo -
d /home/xibo/.local/share 0755 xibo xibo -
d /home/xibo/.local/share/xibo 0755 xibo xibo -
C /home/xibo/.local/bin/gnome-kiosk-script 0755 xibo xibo - /etc/skel/.local/bin/gnome-kiosk-script
