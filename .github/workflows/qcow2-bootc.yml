name: Build QCOW2 from Atomic (bootc)

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: QCOW2 from bootc
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
          df -h /

      - name: Build OCI image
        run: |
          sudo podman build -t localhost/xiboplayer-kiosk:test -f atomic/Containerfile .

      - name: Convert to QCOW2
        run: |
          sudo mkdir -p output
          sudo podman run --rm --privileged \
            --security-opt label=disable \
            -v $(sudo podman info --format '{{.Store.GraphRoot}}'):/var/lib/containers/storage \
            -v ./output:/output \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 \
            --rootfs ext4 \
            localhost/xiboplayer-kiosk:test

      - name: List output
        run: find output -type f | xargs ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qcow2-bootc
          path: output/**/*.qcow2
          retention-days: 7
