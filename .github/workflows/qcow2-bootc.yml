name: Build QCOW2 from Atomic (bootc)

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: QCOW2 from bootc
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install podman and deps
        run: |
          sudo apt-get update
          sudo apt-get install -y podman qemu-utils

      - name: Build OCI image
        run: |
          sudo podman build -t localhost/xiboplayer-kiosk:test -f atomic/Containerfile .

      - name: Convert to QCOW2 via bootc-image-builder
        run: |
          sudo mkdir -p output
          sudo podman run --rm --privileged \
            --security-opt label=disable \
            -v ./output:/output \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 \
            --rootfs ext4 \
            containers-storage:localhost/xiboplayer-kiosk:test

      - name: List output
        run: |
          find output -type f -name "*.qcow2" | while read f; do
            echo "$f $(du -h "$f" | cut -f1)"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qcow2-bootc
          path: output/**/*.qcow2
          retention-days: 7
