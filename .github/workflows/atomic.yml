name: Build Atomic Kiosk Image

on:
  push:
    branches: [main]
    paths: ['atomic/**', 'mkosi-extra/**', 'kiosk/**', 'rpm/**']
    tags: ['v*']
  schedule:
    # Weekly Monday 06:00 UTC — pick up Fedora bootc + RPM updates
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: xiboplayer/xiboplayer-kiosk
  FEDORA_VERSION: '43'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # ── Compute date ONCE so all jobs share the same value ──
  # Without this, ISO-build jobs and the release job each call
  # $(date +%Y%m%d) independently — if the workflow crosses midnight
  # UTC, filenames get 20260416 but the R2 directory gets 20260417
  # and the website composable 404s.
  compute-date:
    name: Compute build date
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.date.outputs.version }}
      tag: ${{ steps.date.outputs.tag }}
    steps:
      - name: Set date
        id: date
        run: |
          DATE=$(date +%Y%m%d)
          echo "version=${DATE}" >> "$GITHUB_OUTPUT"
          echo "tag=atomic-${DATE}" >> "$GITHUB_OUTPUT"

  # ── Pre-flight: wait for current xiboplayer-kiosk RPM to appear ──
  # On tag-triggered runs, this workflow fires concurrently with
  # rpm.yml. The atomic Containerfile then runs `dnf install
  # xiboplayer-kiosk` which races against rpm.yml publishing the new
  # version to dl.xiboplayer.org and intermittently fails with "No
  # match for argument: xiboplayer-kiosk-X.Y.Z". Polling for the
  # version-stamped RPM to land in the repo before we proceed makes
  # the tag-push release flow reliable. Skipped on non-tag runs (the
  # nightly cron + manual dispatch don't bump the version).
  preflight-rpm:
    name: Wait for xiboplayer-kiosk RPM in repo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Poll dl.xiboplayer.org for the tag's RPM
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          # Strip leading 'v' to get the bare version string
          VER="${VERSION#v}"
          URL="https://dl.xiboplayer.org/rpm/fedora/43/noarch/xiboplayer-kiosk-${VER}-1.fc43.noarch.rpm"
          echo "Waiting for $URL"
          # Report the status code on every attempt. `curl -sf` alone cannot
          # tell "not published yet" (404) from a WAF block (403/429) or a
          # connection that never completed, which cost a day of guessing
          # when GitHub runners started being refused by the CDN.
          code=""
          for i in $(seq 1 60); do
            code=$(curl -sI -o /dev/null -w '%{http_code}' --max-time 30 "$URL" || echo "curl-exit-$?")
            if [ "$code" = "200" ]; then
              echo "RPM published — proceeding."
              exit 0
            fi
            echo "Not yet (attempt $i/60, HTTP $code), sleeping 15s..."
            sleep 15
          done
          echo "::error::Timed out waiting for $URL after 15 minutes (last status: $code)"
          echo "Final response, headers and all:"
          curl -sSI --max-time 30 "$URL" 2>&1 | head -20 || true
          exit 1

  build-oci-x86_64:
    name: Build OCI Image (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [preflight-rpm]
    if: ${{ always() && (!startsWith(github.ref, 'refs/tags/v') || needs.preflight-rpm.result == 'success') }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        env:
          # On tag pushes (v0.4.35), also tag with the kiosk version so
          # operators can pin: `bootc switch :v0.4.35`. On branch / schedule
          # / dispatch builds, VERSION is empty and no version tag is added.
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          podman build \
            --tag "${IMG}:${{ env.FEDORA_VERSION }}-x86_64" \
            ${VERSION:+--tag "${IMG}:${VERSION}-x86_64"} \
            -f atomic/Containerfile .
          podman push "${IMG}:${{ env.FEDORA_VERSION }}-x86_64"
          if [ -n "$VERSION" ]; then
            podman push "${IMG}:${VERSION}-x86_64"
          fi

  build-oci-aarch64:
    name: Build OCI Image (aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    needs: [preflight-rpm]
    if: ${{ always() && (!startsWith(github.ref, 'refs/tags/v') || needs.preflight-rpm.result == 'success') }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          podman build \
            --tag "${IMG}:${{ env.FEDORA_VERSION }}-aarch64" \
            ${VERSION:+--tag "${IMG}:${VERSION}-aarch64"} \
            -f atomic/Containerfile .
          podman push "${IMG}:${{ env.FEDORA_VERSION }}-aarch64"
          if [ -n "$VERSION" ]; then
            podman push "${IMG}:${VERSION}-aarch64"
          fi

  push-manifest:
    name: Push multi-arch manifest
    needs: [build-oci-x86_64, build-oci-aarch64]
    if: ${{ !cancelled() && needs.build-oci-x86_64.result == 'success' && needs.build-oci-aarch64.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          FV="${{ env.FEDORA_VERSION }}"

          # Fedora-version manifest (always)
          podman manifest create "${IMG}:${FV}" \
            "${IMG}:${FV}-x86_64" "${IMG}:${FV}-aarch64"
          podman manifest push "${IMG}:${FV}" "docker://${IMG}:${FV}"

          # latest manifest (always)
          podman manifest create "${IMG}:latest" \
            "${IMG}:${FV}-x86_64" "${IMG}:${FV}-aarch64"
          podman manifest push "${IMG}:latest" "docker://${IMG}:latest"

          # Kiosk-version manifest (tag pushes only, e.g. v0.4.35)
          if [ -n "$VERSION" ]; then
            podman manifest create "${IMG}:${VERSION}" \
              "${IMG}:${VERSION}-x86_64" "${IMG}:${VERSION}-aarch64"
            podman manifest push "${IMG}:${VERSION}" "docker://${IMG}:${VERSION}"
            echo "Pushed version manifest: ${IMG}:${VERSION}"
          fi

  build-iso-x86_64:
    name: Build ISO (x86_64)
    needs: [build-oci-x86_64, compute-date]
    if: ${{ !cancelled() && needs.build-oci-x86_64.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Determine version
        id: version
        run: echo "version=${{ needs.compute-date.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Pull OCI image (with retry)
        run: |
          sudo podman login -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} ${{ env.REGISTRY }}
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.FEDORA_VERSION }}-x86_64"
          for attempt in 1 2 3; do
            if sudo podman pull "$IMG"; then
              echo "Pulled on attempt $attempt"
              exit 0
            fi
            echo "Pull attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "ERROR: Failed to pull $IMG after 3 attempts"
          exit 1

      - name: Build ISO
        run: |
          mkdir -p output
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --rootfs ext4 \
            --local \
            --type iso \
            --target-arch x86_64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.FEDORA_VERSION }}-x86_64

      - name: Verify and rename ISO
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ ! -f output/bootiso/install.iso ]; then
            echo "ERROR: ISO not produced by bootc-image-builder"
            find output -type f
            exit 1
          fi
          sudo mv output/bootiso/install.iso \
            output/xiboplayer-kiosk-atomic_${VERSION}_x86_64.iso
          sudo chown -R $(id -u):$(id -g) output/
          ls -lah output/*.iso

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: atomic-iso-x86_64
          path: output/*.iso
          if-no-files-found: error
          retention-days: 30

  build-iso-aarch64:
    name: Build ISO (aarch64)
    needs: [build-oci-aarch64, compute-date]
    if: ${{ !cancelled() && needs.build-oci-aarch64.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Determine version
        id: version
        run: echo "version=${{ needs.compute-date.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Pull OCI image (with retry)
        run: |
          sudo podman login -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} ${{ env.REGISTRY }}
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.FEDORA_VERSION }}-aarch64"
          for attempt in 1 2 3; do
            if sudo podman pull "$IMG"; then
              echo "Pulled on attempt $attempt"
              exit 0
            fi
            echo "Pull attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "ERROR: Failed to pull $IMG after 3 attempts"
          exit 1

      - name: Build ISO
        run: |
          mkdir -p output
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --rootfs ext4 \
            --local \
            --type iso \
            --target-arch aarch64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.FEDORA_VERSION }}-aarch64

      - name: Verify and rename ISO
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ ! -f output/bootiso/install.iso ]; then
            echo "ERROR: ISO not produced by bootc-image-builder"
            find output -type f
            exit 1
          fi
          sudo mv output/bootiso/install.iso \
            output/xiboplayer-kiosk-atomic_${VERSION}_aarch64.iso
          sudo chown -R $(id -u):$(id -g) output/
          ls -lah output/*.iso

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: atomic-iso-aarch64
          path: output/*.iso
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create Release
    needs: [build-iso-x86_64, build-iso-aarch64, push-manifest, compute-date]
    if: always() && (needs.build-iso-x86_64.result == 'success' || needs.build-iso-aarch64.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Determine version
        id: version
        run: |
          echo "tag=${{ needs.compute-date.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "version=${{ needs.compute-date.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -name "*.iso" -exec mv {} release/ \;
          ls -lah release/

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # awscli installed via rpm in the runner image
          BUCKET="${R2_BUCKET}"
          DEST="$BUCKET/xiboplayer-kiosk-atomic/${TAG}"

          for file in release/*.iso; do
            [ -f "$file" ] || continue
            NAME=$(basename "$file")
            echo "Uploading $NAME"
            aws s3 cp "$file" "$DEST/$NAME" --endpoint-url "$R2_ENDPOINT"
          done

          # Generate and upload checksums
          (cd release && sha256sum *.iso > SHA256SUMS)
          aws s3 cp release/SHA256SUMS "$DEST/SHA256SUMS" --endpoint-url "$R2_ENDPOINT"

          # Update LATEST pointer
          echo "$TAG" > /tmp/LATEST
          aws s3 cp /tmp/LATEST "$BUCKET/xiboplayer-kiosk-atomic/LATEST" --endpoint-url "$R2_ENDPOINT"

      - name: Create GitHub Release with download links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          # ISO filenames use the bare date version, NOT the full tag —
          # see the "Verify and rename ISO" build step where output is
          # named "xiboplayer-kiosk-atomic_${VERSION}_{arch}.iso".
          # Without this separation the release body generates 404 URLs
          # with the "atomic-" prefix in the filename (issue #65).
          VERSION: ${{ steps.version.outputs.version }}
          DL: https://images.xiboplayer.org/xiboplayer-kiosk-atomic
        run: |
          NOTES=$(cat <<NOTES_EOF
          # Xiboplayer Kiosk (Atomic)

          Self-contained Fedora bootc kiosk image with immutable OS, automatic updates, and rollback support.

          ## Download

          | Image | Download |
          |-------|----------|
          | **x86_64 ISO** | [xiboplayer-kiosk-atomic_${VERSION}_x86_64.iso](${DL}/${TAG}/xiboplayer-kiosk-atomic_${VERSION}_x86_64.iso) |
          | **aarch64 ISO** | [xiboplayer-kiosk-atomic_${VERSION}_aarch64.iso](${DL}/${TAG}/xiboplayer-kiosk-atomic_${VERSION}_aarch64.iso) |
          | **Checksums** | [SHA256SUMS](${DL}/${TAG}/SHA256SUMS) |

          ## What's included

          - **Fedora bootc 43** (immutable, container-native updates)
          - **Full codecs**: ffmpeg, gstreamer, VA-API
          - **Players**: xiboplayer-electron, xiboplayer-chromium (arexibo available via netinstall — pass \`xibo.profile=arexibo\` on the kernel cmdline)
          - **Multimedia**: VLC, mpv, GNOME Showtime
          - **Kiosk session**: GDM autologin → gnome-kiosk

          ## Install

          Flash the ISO to a USB stick and boot:
          ```
          sudo dd if=xiboplayer-kiosk-atomic_*_x86_64.iso of=/dev/sdX bs=8M status=progress
          ```

          ## Update existing kiosks

          Kiosks update automatically via `bootc-fetch-apply-updates.timer`.

          To update manually or switch from the traditional image:
          ```
          bootc switch ghcr.io/xiboplayer/xiboplayer-kiosk:43
          systemctl reboot
          ```

          ## Rollback

          ```
          bootc rollback
          systemctl reboot
          ```

          ## Verify downloads

          ```
          sha256sum -c SHA256SUMS
          ```
          NOTES_EOF
          )

          gh release view "$TAG" --json tagName >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Kiosk Atomic $TAG" --notes ""
          gh release edit "$TAG" --notes "$NOTES"

          # Upload files to GH Release only if they fit the 2 GB per-file limit.
          # Larger files (e.g. atomic ISOs at 3+ GB) stay on R2 only.
          GH_MAX_BYTES=$((2 * 1024 * 1024 * 1024))
          for f in release/*.iso release/SHA256SUMS; do
            [ -f "$f" ] || continue
            SIZE=$(stat -c%s "$f")
            NAME=$(basename "$f")
            if [ "$SIZE" -gt "$GH_MAX_BYTES" ]; then
              SIZE_GB=$(echo "scale=1; $SIZE / 1024 / 1024 / 1024" | bc)
              echo "Skipping $NAME (${SIZE_GB} GB > 2 GB GH limit) — available on R2"
              continue
            fi
            echo "Uploading $NAME to GH Release..."
            gh release upload "$TAG" "$f" --clobber
          done
