name: Build DEB

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  deb:
    uses: xiboplayer/.github/.github/workflows/build-deb.yml@e8649f4861f729365d7f15c9f5715f5df64dc2c7  # main
    with:
      package-name: xiboplayer-kiosk
      deb-script: 'deb/build-deb.sh'
      distro-matrix: '["ubuntu:24.04", "debian:trixie"]'
      arch-matrix: '["amd64", "arm64"]'
      gpg-sign: true
      publish-to-repo: true
    secrets: inherit
