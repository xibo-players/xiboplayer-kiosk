name: Build DEB

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  deb:
    uses: xibo-players/.github/.github/workflows/build-deb.yml@99b65f33c5227c49a8f093cb776894ef82e4d77e  # main
    with:
      package-name: xiboplayer-kiosk
      deb-script: 'deb/build-deb.sh'
      distro-matrix: '["ubuntu:24.04", "debian:trixie"]'
      arch-matrix: '["amd64", "arm64"]'
      gpg-sign: true
      publish-to-repo: true
    secrets: inherit
