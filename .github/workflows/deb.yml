name: Build DEB

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

jobs:
  deb:
    uses: xibo-players/.github/.github/workflows/build-deb.yml@main
    with:
      package-name: xiboplayer-kiosk
      deb-script: 'deb/build-deb.sh'
      distro-matrix: '["ubuntu:24.04", "debian:trixie"]'
      default-version: '0.4.14'
      gpg-sign: true
      publish-to-repo: true
    secrets: inherit
