name: Build DEB

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  deb:
    uses: xiboplayer/.github/.github/workflows/build-deb.yml@9af382cf12830bca426a1a99e4b59532ee72a711  # main
    with:
      package-name: xiboplayer-kiosk
      deb-script: 'deb/build-deb.sh'
      distro-matrix: '["ubuntu:24.04", "debian:trixie"]'
      arch-matrix: '["amd64", "arm64"]'
      gpg-sign: true
      publish-to-repo: true
    secrets: inherit
