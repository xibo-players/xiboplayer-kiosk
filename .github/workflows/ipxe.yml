name: Build iPXE Network Boot

on:
  push:
    tags: ['v*']
    paths: ['ipxe/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipxe:
    name: Build iPXE image
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y git gcc make mtools perl liblzma-dev curl python3-pip
          pip install awscli --break-system-packages

      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone iPXE source
        run: git clone --depth 1 https://github.com/ipxe/ipxe.git /tmp/ipxe

      - name: Enable HTTPS in iPXE
        run: |
          cat >> /tmp/ipxe/src/config/general.h << 'EOF'
          #define DOWNLOAD_PROTO_HTTPS
          #define IMAGE_TRUST_CMD
          EOF

      - name: Copy boot script
        run: cp ipxe/boot.ipxe /tmp/ipxe/src/boot.ipxe

      - name: Build BIOS image
        run: |
          cd /tmp/ipxe/src
          make -j$(nproc) bin/ipxe.usb EMBED=boot.ipxe
          ls -lh bin/ipxe.usb

      - name: Build EFI binary
        run: |
          cd /tmp/ipxe/src
          make -j$(nproc) bin-x86_64-efi/ipxe.efi EMBED=boot.ipxe
          ls -lh bin-x86_64-efi/ipxe.efi

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp /tmp/ipxe/src/bin/ipxe.usb dist/xiboplayer-ipxe.img
          cp /tmp/ipxe/src/bin-x86_64-efi/ipxe.efi dist/xiboplayer-ipxe.efi
          cp ipxe/boot.ipxe dist/boot.ipxe
          ls -lh dist/

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          BUCKET="s3://xiboplayer-images"
          aws s3 cp dist/xiboplayer-ipxe.img "$BUCKET/ipxe/xiboplayer-ipxe.img" \
            --endpoint-url "$R2_ENDPOINT" --content-type application/octet-stream
          aws s3 cp dist/xiboplayer-ipxe.efi "$BUCKET/ipxe/xiboplayer-ipxe.efi" \
            --endpoint-url "$R2_ENDPOINT" --content-type application/octet-stream
          aws s3 cp dist/boot.ipxe "$BUCKET/ipxe/boot.ipxe" \
            --endpoint-url "$R2_ENDPOINT" --content-type text/plain
          echo "Uploaded to R2:"
          echo "  https://dl.xiboplayer.org/ipxe/xiboplayer-ipxe.img"
          echo "  https://dl.xiboplayer.org/ipxe/xiboplayer-ipxe.efi"
          echo "  https://dl.xiboplayer.org/ipxe/boot.ipxe"

      - name: Upload to GitHub Release
        run: |
          # Upload to latest release (tag or most recent)
          TAG="${GITHUB_REF_NAME}"
          if [[ "${{ github.ref_type }}" != "tag" ]]; then
            TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' || echo "")
          fi
          if [ -n "$TAG" ]; then
            for f in dist/*; do
              gh release upload "$TAG" "$f" --clobber || true
            done
            echo "Uploaded to release $TAG"
          else
            echo "No release found, skipping"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipxe-images
          path: dist/
          retention-days: 90
