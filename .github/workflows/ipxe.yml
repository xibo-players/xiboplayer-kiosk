name: Build iPXE Network Boot

on:
  push:
    branches: [main]
    paths: ['ipxe/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  FEDORA_VERSION: '43'

jobs:
  build-ipxe:
    name: Build iPXE image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ubuntu:24.04

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y git gcc make mtools perl liblzma-dev curl python3-pip
          pip install awscli --break-system-packages

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Clone iPXE source
        run: git clone --depth 1 https://github.com/ipxe/ipxe.git /tmp/ipxe

      - name: Enable HTTPS and features in iPXE
        run: |
          printf '%s\n' \
            '#define DOWNLOAD_PROTO_HTTPS' \
            '#define DOWNLOAD_PROTO_HTTP' \
            '#define IMAGE_TRUST_CMD' \
            '#define NET_PROTO_IPV4' \
            >> /tmp/ipxe/src/config/general.h
          sed -i 's|//#define\s*CERT_CMD|#define CERT_CMD|' /tmp/ipxe/src/config/general.h || true

      - name: Copy boot script
        run: cp ipxe/boot.ipxe /tmp/ipxe/src/boot.ipxe

      - name: Build BIOS iPXE
        run: |
          cd /tmp/ipxe/src
          make -j$(nproc) bin/ipxe.lkrn EMBED=boot.ipxe
          make -j$(nproc) bin/ipxe.usb EMBED=boot.ipxe
          ls -lh bin/ipxe.lkrn bin/ipxe.usb

      - name: Build x86_64 EFI binary
        run: |
          cd /tmp/ipxe/src
          make -j$(nproc) bin-x86_64-efi/ipxe.efi EMBED=boot.ipxe
          ls -lh bin-x86_64-efi/ipxe.efi

      - name: Install ARM64 cross-compiler
        run: apt-get install -y gcc-aarch64-linux-gnu

      - name: Build ARM64 EFI binary
        run: |
          cd /tmp/ipxe/src
          make -j$(nproc) CROSS=aarch64-linux-gnu- bin-arm64-efi/ipxe.efi EMBED=boot.ipxe
          ls -lh bin-arm64-efi/ipxe.efi

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp /tmp/ipxe/src/bin/ipxe.usb dist/xiboplayer-ipxe-bios.img
          cp /tmp/ipxe/src/bin-x86_64-efi/ipxe.efi dist/xiboplayer-ipxe-uefi-x86_64.efi
          cp /tmp/ipxe/src/bin-arm64-efi/ipxe.efi dist/xiboplayer-ipxe-uefi-aarch64.efi
          ls -lh dist/

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          BUCKET="${R2_BUCKET}"
          for f in dist/*.img dist/boot.ipxe; do
            [ -f "$f" ] || continue
            NAME=$(basename "$f")
            CT="application/octet-stream"
            [[ "$NAME" == *.ipxe ]] && CT="text/plain"
            aws s3 cp "$f" "$BUCKET/ipxe/$NAME" \
              --endpoint-url "$R2_ENDPOINT" --content-type "$CT"
            echo "  https://dl.xiboplayer.org/ipxe/$NAME"
          done

      - name: Upload to GitHub Release
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${{ github.ref_type }}" != "tag" ]]; then
            TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' || echo "")
          fi
          if [ -n "$TAG" ]; then
            for f in dist/*; do
              gh release upload "$TAG" "$f" --clobber || true
            done
            echo "Uploaded to release $TAG"
          else
            echo "No release found, skipping"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ipxe-images
          path: dist/
          retention-days: 90
