name: Build Kiosk Images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    uses: xibo-players/.github/.github/workflows/build-iso.yml@5c3b3699cd05c12bb3ec76e5d1d317d539dd69b4  # main
    with:
      package-name: xiboplayer-kiosk
      kickstart-file: 'kickstart/xiboplayer-kiosk.ks'
      build-disk-images: true
      build-self-contained-iso: true
      build-netinstall: true
      architectures: 'x86_64,aarch64'
    secrets: inherit

  # ──────────────────────────────────────────────────────────────────
  # Post-release automation (#86) — regenerate user-visible artefacts
  # that reference the released version. Only runs on tag pushes after
  # the image build has succeeded. See issue #86 for the full design.
  # ──────────────────────────────────────────────────────────────────

  update-readme:
    name: Bump README download matrix
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Rewrite README matrix to the new tag
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "Updating README.md to version $TAG"
          # Match the two URL shapes in the download matrix:
          #   .../xiboplayer-kiosk/<ver>/xiboplayer-kiosk-everything_<ver>_<arch>.iso
          #   .../xiboplayer-kiosk/<ver>/xiboplayer-kiosk_<ver>_<arch>.{qcow2,raw.xz}
          # The '-?[a-z]*' after `xiboplayer-kiosk` captures the optional
          # suffix (everything / netinstall / '') so one sed handles both.
          sed -i -E \
            "s|xiboplayer-kiosk/[0-9]+\.[0-9]+\.[0-9]+/xiboplayer-kiosk(-?[a-z]*)_[0-9]+\.[0-9]+\.[0-9]+_|xiboplayer-kiosk/${TAG}/xiboplayer-kiosk\1_${TAG}_|g" \
            README.md

          # Verify the rewrite actually landed
          if ! grep -q "/${TAG}/" README.md; then
            echo "::error::sed did not rewrite README.md to ${TAG}"
            exit 1
          fi
          echo "README.md now references version ${TAG}"

      - name: Commit and push (if README changed)
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if git diff --quiet README.md; then
            echo "README.md already at ${TAG} — no commit needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(release): bump README download matrix to ${TAG}

Auto-regenerated by .github/workflows/image.yml on tag push.
See #86 for the design."
          # Push with retry — main may have moved between fetch + commit
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed, rebasing and retrying..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          echo "::error::Failed to push README update after 3 attempts"
          exit 1

  dispatch-www:
    name: Trigger xiboplayer-www regeneration
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to xiboplayer-www
        env:
          # WWW_DISPATCH_TOKEN is a fine-grained PAT with actions:write
          # on xibo-players/xiboplayer-www. See #86 for the setup steps.
          # If unset, this step logs a warning and exits 0 so the rest of
          # the release pipeline continues.
          GH_TOKEN: ${{ secrets.WWW_DISPATCH_TOKEN }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::WWW_DISPATCH_TOKEN not set — skipping www regen trigger. See #86."
            exit 0
          fi
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "Firing repository_dispatch kiosk-released to xiboplayer-www with version=$TAG"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/xibo-players/xiboplayer-www/dispatches \
            -f event_type=kiosk-released \
            -f "client_payload[version]=${TAG}" \
            -f "client_payload[source]=xiboplayer-kiosk" \
            -f "client_payload[tag]=${GITHUB_REF}"
          echo "Dispatch fired"
