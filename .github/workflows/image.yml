name: Build Kiosk Images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    uses: xiboplayer/.github/.github/workflows/build-iso.yml@e8649f4861f729365d7f15c9f5715f5df64dc2c7  # main
    with:
      package-name: xiboplayer-kiosk
      kickstart-file: 'kickstart/xiboplayer-kiosk.ks'
      build-disk-images: true
      build-self-contained-iso: true
      build-netinstall: true
      architectures: 'x86_64,aarch64'

      # Brand the stock Fedora boot-menu entry text via mkksiso -R
      # (native text substitution). Applies to every boot-config path
      # in one pass: EFI grub.cfg, BOOT.conf, BIOS grub.cfg × 2 paths,
      # isolinux.cfg. No custom grub.cfg / isolinux.cfg overlay file.
      # No xorriso post-patch. mkksiso handles everything internally.
      iso-grub-replacements: |
        Install Fedora 43|Install xiboplayer kiosk
        Test this media & install Fedora 43|Test media and install xiboplayer kiosk
        Install Fedora 43 in basic graphics mode|Install xiboplayer kiosk (basic graphics)
        Rescue a Fedora system|Rescue xiboplayer kiosk system
        set default="1"|set default="0"

      # Default player for the single branded install entry. Users
      # switch to Electron/Arexibo post-install via Settings > Player.
      iso-cmdline-append: 'xibo.profile=chromium inst.loglevel=info'

      # Volume ID: left at Fedora's default so libosinfo / GNOME Boxes
      # / virt-install recognise the ISO as Fedora 43 and pre-fill their
      # OS picker. We ARE installing Fedora (+ a kickstart), so it's
      # legitimate — stage2 / kickstart lookup uses the ipxe / mkksiso
      # mechanisms, not a LABEL-based match on the volid.
    secrets: inherit

  # ──────────────────────────────────────────────────────────────────
  # Post-release automation (#86) — regenerate user-visible artefacts
  # that reference the released version. Only runs on tag pushes after
  # the image build has succeeded. See issue #86 for the full design.
  # ──────────────────────────────────────────────────────────────────

  update-readme:
    name: Bump README download matrix
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v6.0.2
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Rewrite README matrix to the new tag
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "Updating README.md to version $TAG"
          # Match the two URL shapes in the download matrix:
          #   .../xiboplayer-kiosk/<ver>/xiboplayer-kiosk-everything_<ver>_<arch>.iso
          #   .../xiboplayer-kiosk/<ver>/xiboplayer-kiosk_<ver>_<arch>.{qcow2,raw.xz}
          # The '-?[a-z]*' after `xiboplayer-kiosk` captures the optional
          # suffix (everything / netinstall / '') so one sed handles both.
          sed -i -E \
            "s|xiboplayer-kiosk/[0-9]+\.[0-9]+\.[0-9]+/xiboplayer-kiosk(-?[a-z]*)_[0-9]+\.[0-9]+\.[0-9]+_|xiboplayer-kiosk/${TAG}/xiboplayer-kiosk\1_${TAG}_|g" \
            README.md

          # Verify the rewrite actually landed
          if ! grep -q "/${TAG}/" README.md; then
            echo "::error::sed did not rewrite README.md to ${TAG}"
            exit 1
          fi
          echo "README.md now references version ${TAG}"

      - name: Commit and push (if README changed)
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if git diff --quiet README.md; then
            echo "README.md already at ${TAG} — no commit needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(release): bump README download matrix to ${TAG}

          Auto-regenerated by .github/workflows/image.yml on tag push.
          See #86 for the design."
          # Push with retry — main may have moved between fetch + commit
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed, rebasing and retrying..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          echo "::error::Failed to push README update after 3 attempts"
          exit 1

  dispatch-www:
    name: Trigger xiboplayer-www regeneration
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to xiboplayer-www
        env:
          # WWW_DISPATCH_TOKEN is a fine-grained PAT with actions:write
          # on xiboplayer/xiboplayer-www. See #86 for the setup steps.
          # If unset, this step logs a warning and exits 0 so the rest of
          # the release pipeline continues.
          GH_TOKEN: ${{ secrets.WWW_DISPATCH_TOKEN }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::WWW_DISPATCH_TOKEN not set — skipping www regen trigger. See #86."
            exit 0
          fi
          # Extract version from tag (v0.5.2 → 0.5.2) or fall back to
          # the spec Version for workflow_dispatch / push-on-main runs.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            TAG=$(grep -m1 '^Version:' rpm/xiboplayer-kiosk.spec 2>/dev/null | awk '{print $2}' || echo 'unknown')
          fi
          echo "Firing repository_dispatch kiosk-released to xiboplayer-www with version=$TAG"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/xiboplayer/xiboplayer-www/dispatches \
            -f event_type=kiosk-released \
            -f "client_payload[version]=${TAG}" \
            -f "client_payload[source]=xiboplayer-kiosk" \
            -f "client_payload[tag]=${GITHUB_REF}"
          echo "Dispatch fired"
