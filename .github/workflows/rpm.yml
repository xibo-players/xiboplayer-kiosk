name: Build RPM

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  rpm:
    uses: xiboplayer/.github/.github/workflows/build-rpm.yml@cb1cc4593f5292fa2d5bd9c69b2d5c49dddde55a  # main
    with:
      package-name: xiboplayer-kiosk
      rpm-spec: 'rpm/xiboplayer-kiosk.spec'
      fedora-matrix: '["43"]'
      source-tarball: 'full'
      gpg-sign: true
    secrets: inherit
