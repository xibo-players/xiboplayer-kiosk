name: Build RPM

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  rpm:
    uses: xiboplayer/.github/.github/workflows/build-rpm.yml@9af382cf12830bca426a1a99e4b59532ee72a711  # main
    with:
      package-name: xiboplayer-kiosk
      rpm-spec: 'rpm/xiboplayer-kiosk.spec'
      fedora-matrix: '["43", "44"]'
      source-tarball: 'full'
      gpg-sign: true
      publish-to-repo: ${{ startsWith(github.ref, 'refs/tags/v') }}
    secrets: inherit
