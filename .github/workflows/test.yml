name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install bats + jq + zstd
        run: sudo apt-get update && sudo apt-get install -y bats jq zstd
      - name: Run bats unit tests
        run: bats tests/unit/
