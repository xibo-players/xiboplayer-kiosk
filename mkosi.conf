[Distribution]
Distribution=fedora
Release=43

[Output]
Format=disk
ImageId=xiboplayer-kiosk
OutputDirectory=output

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=no
KernelCommandLine=root=gpt-auto quiet rhgb
RootPassword=root
ExtraTrees=mkosi-extra
Packages=
    @core
    kernel-core
    efibootmgr
    systemd-boot-unsigned
    gdm
    gnome-kiosk
    gnome-kiosk-script-session
    avahi
    nss-mdns
    wireguard-tools
    NetworkManager-wifi
    linux-firmware
    vlc
    mpv
    dunst
    unclutter
    zenity
    # ptyxis — modern GNOME Console successor (Fedora 43 default), used by
    # handle_terminal() in the first-boot menu and Ctrl+S via keyd. The
    # older `gnome-terminal` was deprecated upstream.
    ptyxis
    # gnome-control-center — optional escape hatch in the first-boot
    # Settings sub-menu. NOT used by main first-boot flows.
    gnome-control-center
    opendoas
    keyd
    mesa-dri-drivers
    mesa-va-drivers
    libva
    gstreamer1-plugins-base
    gstreamer1-plugins-good
    gstreamer1-plugins-bad-free
    gstreamer1-plugins-bad-freeworld
    gstreamer1-plugins-ugly-free
    gstreamer1-plugins-ugly
    gstreamer1-plugin-openh264
    gstreamer1-plugin-libav
    ffmpeg
    ffmpeg-libs
    dejavu-sans-fonts
    dejavu-sans-mono-fonts
    google-noto-sans-fonts
    google-noto-emoji-color-fonts
    xiboplayer-electron
    xiboplayer-chromium
    xiboplayer-kiosk
    # Full glibc locale support so the zenity Language picker (#67)
    # can offer every UTF-8 locale, not just English (#103).
    glibc-all-langpacks
RemovePackages=
    ffmpeg-free
    gnome-initial-setup
    # xdg-user-dirs-gtk ships the "rename standard directories?" prompt
    # that appears when the locale changes. Kill it at the source — we
    # want English-named dirs (~/Downloads etc.) regardless of UI locale.
    # See also kickstart %post for the enabled=False config file.
    xdg-user-dirs-gtk

[Runtime]
Firmware=uefi
