# xiboplayer kiosk — BIOS boot menu (syslinux)
#
# Flat menu — syslinux doesn't support submenus like grub. Mirrors
# the grub.cfg structure as closely as possible. See grub.cfg for
# the full design rationale.

default vesamenu.c32
timeout 100
totaltimeout 6000

menu title xiboplayer-kiosk

label chromium
  menu label Install xiboplayer-kiosk
  menu default
  kernel vmlinuz
  append initrd=initrd.img inst.stage2=hd:LABEL=XIBOPLAYER xibo.profile=chromium quiet

label verify
  menu label Verify media & install xiboplayer-kiosk
  kernel vmlinuz
  append initrd=initrd.img inst.stage2=hd:LABEL=XIBOPLAYER rd.live.check xibo.profile=chromium quiet

menu separator

label electron
  menu label Install xiboplayer-kiosk (default: Electron)
  kernel vmlinuz
  append initrd=initrd.img inst.stage2=hd:LABEL=XIBOPLAYER xibo.profile=electron quiet

label arexibo
  menu label Install xiboplayer-kiosk (default: Arexibo — network)
  kernel vmlinuz
  append initrd=initrd.img inst.stage2=hd:LABEL=XIBOPLAYER xibo.profile=arexibo quiet

label text
  menu label Install xiboplayer-kiosk — text mode
  kernel vmlinuz
  append initrd=initrd.img inst.stage2=hd:LABEL=XIBOPLAYER xibo.profile=chromium inst.text quiet

label rescue
  menu label Rescue xiboplayer-kiosk system
  kernel vmlinuz
  append initrd=initrd.img inst.stage2=hd:LABEL=XIBOPLAYER inst.rescue quiet
