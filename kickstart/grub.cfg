# xiboplayer kiosk — UEFI boot menu
# All three players are installed. The selected entry sets the default.
# Press Ctrl+R after boot to switch player at any time.

set default=0
set timeout=10

insmod gfxterm
set gfxmode=auto
terminal_output gfxterm

set menu_color_normal=white/black
set menu_color_highlight=white/blue

menuentry '── xiboplayer kiosk ── WARNING: these entries ERASE ALL DATA ON DISK ──' --unrestricted { true ; }

menuentry 'Install xiboplayer-kiosk — Chromium (ERASES ALL DATA ON DISK)' --class fedora --class os {
    linuxefi /images/pxeboot/vmlinuz inst.stage2=hd:LABEL=Fedora-S-dvd-x86_64-43 inst.ks=https://raw.githubusercontent.com/xibo-players/xiboplayer-kiosk/main/kickstart/xiboplayer-kiosk.ks xibo.profile=chromium quiet
    initrdefi /images/pxeboot/initrd.img
}

menuentry 'Install xiboplayer-kiosk — Electron (ERASES ALL DATA ON DISK)' --class fedora --class os {
    linuxefi /images/pxeboot/vmlinuz inst.stage2=hd:LABEL=Fedora-S-dvd-x86_64-43 inst.ks=https://raw.githubusercontent.com/xibo-players/xiboplayer-kiosk/main/kickstart/xiboplayer-kiosk.ks xibo.profile=electron quiet
    initrdefi /images/pxeboot/initrd.img
}

# Text-mode fallback (#104). The default Chromium entry runs anaconda
# in its graphical UI with a progress bar + slide carousel; this entry
# appends `inst.text` for headless / low-VRAM / serial-only targets
# where the graphical installer fails to start. Same kickstart, same
# Chromium profile — only the anaconda frontend changes.
menuentry 'Install xiboplayer-kiosk — text mode (fallback, ERASES ALL DATA ON DISK)' --class fedora --class os {
    linuxefi /images/pxeboot/vmlinuz inst.stage2=hd:LABEL=Fedora-S-dvd-x86_64-43 inst.ks=https://raw.githubusercontent.com/xibo-players/xiboplayer-kiosk/main/kickstart/xiboplayer-kiosk.ks xibo.profile=chromium quiet inst.text
    initrdefi /images/pxeboot/initrd.img
}

# Arexibo netinstall opt-in: pass xibo.profile=arexibo manually on the kernel
# line (not a default menu entry — arexibo is not baked into the ISO, it gets
# pulled from the network only when this profile is selected).
